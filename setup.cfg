[flake8]
exclude =
    .git,
    .tox,
    migrations
    assets
    docker
    media_root
    node_modules
    static
    static_root
max-line-length = 119
extend-ignore =
    ANN001
    ANN002
    ANN003
    ANN101
    ANN201
    ANN204

[isort]
profile = black
line_length = 119
skip_glob =
    .tox
    */migrations/*
    assets
    docker
    media_root
    node_modules
    static
    static_root
known_django = django
known_iipdash = iipdash
known_apps = core,administrative,demographics,education,infrastructure,users
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,IIPDASH,APPS,FIRSTPARTY,LOCALFOLDER
