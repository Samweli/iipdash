[flake8]
exclude =
    .git,
    .tox,
    migrations
    assets
    docker
    media_root
    node_modules
    static
    static_root
max-line-length = 119
extend-ignore =
    ANN101
    ANN201

[isort]
profile = black
line_length = 119
skip_glob =
    .tox
    */migrations/*
    assets
    docker
    media_root
    node_modules
    static
    static_root
known_django = django
known_iipdash = iipdash
known_core = core
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,IIPDASH,CORE,FIRSTPARTY,LOCALFOLDER
