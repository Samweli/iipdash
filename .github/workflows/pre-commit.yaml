name: pre-commit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout codes
      id: checkout-codes
      uses: actions/checkout@v4.2.2

    - name: Setup python
      id: setup-python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: 3.12.7
        architecture: x64

    - name: Install dependencies
      run: make install

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
