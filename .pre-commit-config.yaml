repos:
  - repo: local
    hooks:
      - id: black
        name: format codes
        types: [python]
        language: system
        entry: make format/black

      - id: isort
        name: sort imports
        types: [python]
        language: system
        entry: make lint/isort

      - id: flake8
        name: check style
        types: [python]
        language: system
        entry: make lint/flake8

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.0.0
    hooks:
      - id: commitizen
