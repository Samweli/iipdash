services:
  iipdash: &app
    restart: unless-stopped
    network_mode: host
    build:
      context: .
      dockerfile: ./docker/production/django/Dockerfile
    image: iipdash_app
    command: /start
    volumes:
      - ${STATIC_ROOT}:${STATIC_ROOT}
      - ${MEDIA_ROOT}:${MEDIA_ROOT}
    env_file:
      - ./.env

  celeryworker:
    <<: *app
    image: iipdash_celery_worker
    command: /start-celery-worker

  celerybeat:
    <<: *app
    image: iipdash_celery_beat
    command: /start-celery-beat
    depends_on:
      - celeryworker

  flower:
    <<: *app
    image: iipdash_flower
    command: /start-flower
    depends_on:
      - celeryworker
